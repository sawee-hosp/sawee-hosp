    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .draggable-modal {
            position: absolute;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            resize: both;
            overflow: auto;
            min-width: 400px;
            min-height: 300px;
            max-width: 95vw;
            max-height: 95vh;
        }
        .draggable-modal::-webkit-resizer {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2394a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15l-6 6"/><path d="M21 8l-13 13"/><path d="M21 1l-20 20"/></svg>');
            background-repeat: no-repeat;
            background-position: bottom right;
        }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 1px;
            background-color: #e2e8f0;
            border: 1px solid #e2e8f0;
        }
        .calendar-cell { background-color: white; min-height: 120px; }
        .calendar-cell.weekend { background-color: #f8fafc; }
        .calendar-cell.other-month { background-color: #f1f5f9; color: #94a3b8; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }

        .dragging-row { opacity: 0.5; background-color: #e0e7ff !important; }
        .drop-target-row { border-top: 2px solid #4f46e5; }
    </style>
</head>

        // --- คอมโพเนนต์ที่ช่วยให้ลาก Modal ได้ ---
        const DraggableModal = ({ isOpen, onClose, title, children, defaultPosition = { x: 50, y: 50 } }) => {
            const [position, setPosition] = useState(defaultPosition);
            const [isDragging, setIsDragging] = useState(false);
            const [dragOffset, setDragOffset] = useState({ x: 0, y: 0 });
            
            if (!isOpen) return null;

            const handleMouseDown = (e) => {
                setIsDragging(true);
                setDragOffset({ x: e.clientX - position.x, y: e.clientY - position.y });
            };
            const handleMouseMove = (e) => {
                if (isDragging) setPosition({ x: e.clientX - dragOffset.x, y: e.clientY - dragOffset.y });
            };
            const handleMouseUp = () => setIsDragging(false);

            return (
                <div className="fixed inset-0 pointer-events-none z-[55]" onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}>
                    <div className="draggable-modal bg-white rounded-xl flex flex-col pointer-events-auto border border-slate-300" style={{ left: `${position.x}px`, top: `${position.y}px` }}>
                        <div className="flex justify-between items-center p-3 border-b border-slate-200 bg-slate-100 drag-handle rounded-t-xl" onMouseDown={handleMouseDown}>

                    </div>
                </div>
            );

            const monthNamesThai = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

            useEffect(() => {

            }, [currentUser, selectedWard, currentYear, currentMonth]);

            const filteredNurses = useMemo(() => {

            const pendingRequestsCount = swapRequests.filter(r => r.status === 'Pending').length;

            const handleLogin = (e) => {

            // Drag & Drop

            const handleDragEnd = (e) => { e.target.classList.remove('dragging-row'); setDraggedNurseIdx(null); };

            const saveNurseOrderToDB = async () => {
                if (isSaving || !isOrderChanged) return;
                setIsSaving(true);
                const nurseOrders = filteredNurses.map(n => ({ id: n.id, orderIndex: n.orderIndex }));
                try {

                finally { setIsSaving(false); }
            };

            const ruleViolations = useMemo(() => {
                const viols = {}; 
                const firstDayOfWeekOffset = getDayOfWeek(1); 
                filteredNurses.forEach(nurse => {
                    const nId = nurse.id;
                    const intervals = [];
                    for(let d=1; d<=daysInMonth; d++) {
                        const shifts = schedules[`${nId}-${d}`] || [];
                        shifts.forEach(s => {
                            const baseS = getBaseShift(s);
                            const def = shiftOptions.find(o => o.id === baseS) ? { start: 8, duration: parseFloat(shiftOptions.find(o=>o.id===baseS).countValue)*8 || 8 } : { start: 8, duration: 8 };
                            if (baseS === '8-20') { def.start=8; def.duration=12; }
                            if (baseS === '20-8') { def.start=20; def.duration=12; }
                            if (baseS === 'ด' || baseS === '*ด' || baseS === 'Rด') { def.start=0; def.duration=8; }
                            if (baseS === 'บ' || baseS === '*บ' || baseS === 'Rบ') { def.start=16; def.duration=8; }
                            if (baseS === 'O' || baseS === 'VAC') def.duration = 0;

                            if (def.duration > 0) {
                                const startAbs = (d - 1) * 24 + def.start;
                                const endAbs = startAbs + def.duration;
                                intervals.push({ day: d, shift: s, start: startAbs, end: endAbs, duration: def.duration });
                            }
                        });
                    }
                    intervals.sort((a, b) => a.start - b.start);
                    for (let i = 1; i < intervals.length; i++) {
                        if (intervals[i].start - intervals[i-1].end < 11) {
                            viols[`${nId}-${intervals[i-1].day}`] = "พักไม่ถึง 11 ชม.";
                            viols[`${nId}-${intervals[i].day}`] = "พักไม่ถึง 11 ชม.";
                        }
                    }
                    for (let d = 1; d <= daysInMonth; d++) {
                        let hoursToday = 0;
                        const dayStart = (d - 1) * 24; const dayEnd = d * 24;
                        intervals.forEach(inv => {
                            const overlapStart = Math.max(dayStart, inv.start);
                            const overlapEnd = Math.min(dayEnd, inv.end);
                            if (overlapStart < overlapEnd) hoursToday += (overlapEnd - overlapStart);
                        });
                        if (hoursToday > 12) viols[`${nId}-${d}`] = "เกิน 12 ชม./วัน";
                    }
                    const weeklyData = {}; 
                    intervals.forEach(inv => {
                        const d = inv.day;
                        const weekIndex = Math.floor((d - 1 + firstDayOfWeekOffset) / 7);
                        if (!weeklyData[weekIndex]) weeklyData[weekIndex] = { hours: 0, twelveHourCount: 0, daysWith12h: new Set(), allDays: new Set() };
                        weeklyData[weekIndex].hours += inv.duration;
                        weeklyData[weekIndex].allDays.add(d);
                        if (inv.duration === 12) {
                            weeklyData[weekIndex].twelveHourCount += 1;
                            weeklyData[weekIndex].daysWith12h.add(d);
                        }
                    });
                    Object.values(weeklyData).forEach(week => {
                        if (week.hours > 60) week.allDays.forEach(d => viols[`${nId}-${d}`] = "เกิน 60 ชม./สัปดาห์");
                        if (week.twelveHourCount > 3) week.daysWith12h.forEach(d => viols[`${nId}-${d}`] = "เวร 12 ชม. เกิน 3 วัน/สัปดาห์");
                    });
                });
                return viols;
            }, [schedules, filteredNurses, daysInMonth, currentYear, currentMonth, shiftOptions]);

            const handleCellClick = (nurse, day) => {
                if (currentUser.role === 'Headward') setSelectedCell({ nurse, day });
                else if (currentUser.id === nurse.id) {
                    const currentShifts = schedules[`${nurse.id}-${day}`] || [];
                    if (currentShifts.length > 0) setRequestSwapModal({ isOpen: true, cell: { nurse, day }, shiftToSwap: currentShifts[0] });
                    else setAlertMsg("คุณไม่สามารถเพิ่มเวรเองได้ กรุณาติดต่อหัวหน้าวอร์ด");
                }
            };

            const handleNameClick = (nurse) => {
                const freshNurseData = nurses.find(n => n.id === nurse.id) || nurse;
                setNurseModal({ isOpen: true, data: { ...freshNurseData } });
            };

            const handleToggleShift = async (exactShiftId) => {
                if (!selectedCell || isSaving) return;
                const { nurse, day } = selectedCell;
                const cellKey = `${nurse.id}-${day}`;
                const currentShifts = schedules[cellKey] || [];
                const isRemoving = currentShifts.includes(exactShiftId);
                
                let newShifts;
                if (isRemoving) newShifts = currentShifts.filter(s => s !== exactShiftId);
                else {
                    if (currentShifts.length >= 2) return; 
                    const isLeave = exactShiftId.startsWith('O') || exactShiftId.startsWith('VAC');
                    if (isLeave) newShifts = [exactShiftId];
                    else if (currentShifts.some(s => s.startsWith('O') || s.startsWith('VAC'))) newShifts = [exactShiftId];
                    else newShifts = [...currentShifts, exactShiftId];
                }
                
                setSchedules(prev => ({ ...prev, [cellKey]: newShifts }));
                const payload = {
                    action: 'saveShift',
                    data: {
                        recordId: `${nurse.id}-${currentYear}-${currentMonth}-${day.toString().padStart(2, '0')}`,
                        date: `${currentYear}-${currentMonth}-${day.toString().padStart(2, '0')}`,
                        ward: selectedWard, nurseId: nurse.id, nurseName: nurse.name, shifts: newShifts
                    }
                };

                setIsSaving(true);
                try {
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const result = await response.json();
                    if (result.status !== 'success') throw new Error("Save failed");
                } catch (error) {
                    setSchedules(prev => ({ ...prev, [cellKey]: currentShifts }));
                    setAlertMsg("บันทึกข้อมูลไม่สำเร็จ");
                } finally { setIsSaving(false); }
            };

            // Smart Filler Algorithm
            const runSmartFiller = async () => {
                setIsSaving(true);
                let newSchedules = { ...schedules };
                
                const targets = { '8-20': fillTargets.d12, '20-8': fillTargets.n12, 'ช': fillTargets.m, 'บ': fillTargets.a, 'ด': fillTargets.n };
                const coreShifts = ['8-20', '20-8', 'ด', 'ช', 'บ']; // จัดเวรยาวก่อน

                let nurseShiftCounts = {};
                filteredNurses.forEach(n => nurseShiftCounts[n.id] = 0);
                
                for (let d = 1; d <= daysInMonth; d++) {
                    filteredNurses.forEach(n => {
                        const key = `${n.id}-${d}`;
                        if (newSchedules[key] && newSchedules[key].length > 0) nurseShiftCounts[n.id]++;
                    });
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    // นับเวรที่มีอยู่แล้วในวันนั้น (นับแบบ 12 ชม. กินโควต้า 2 ช่อง)
                    let currentCounts = { 'ช': 0, 'บ': 0, 'ด': 0, '8-20': 0, '20-8': 0 };
                    filteredNurses.forEach(n => {
                        const key = `${n.id}-${d}`;
                        const shifts = newSchedules[key] || [];
                        shifts.forEach(s => {
                            const base = getBaseShift(s);
                            if (currentCounts[base] !== undefined) currentCounts[base]++;
                        });
                    });

                    for (let shiftType of coreShifts) {
                        // ปรับลดยอดที่ต้องการ หากมีการจัดเวร 12 ชม. ไปแล้ว
                        let exactNeeded = targets[shiftType] - currentCounts[shiftType];
                        
                        if (shiftType === 'ช') exactNeeded = targets['ช'] - currentCounts['ช'] - currentCounts['8-20'];
                        if (shiftType === 'บ') exactNeeded = targets['บ'] - currentCounts['บ'] - currentCounts['8-20'];
                        if (shiftType === 'ด') exactNeeded = targets['ด'] - currentCounts['ด'] - currentCounts['20-8'];
                        
                        if (exactNeeded <= 0) continue;

                        let availableNurses = filteredNurses.filter(n => {
                            const key = `${n.id}-${d}`;
                            if (newSchedules[key] && newSchedules[key].length > 0) return false;

                            const prevKey = `${n.id}-${d-1}`;
                            const yestShifts = d > 1 ? (newSchedules[prevKey] || []) : [];
                            const yestBaseShifts = yestShifts.map(s => getBaseShift(s));

                            // ป้องกันการจัดเวรที่ได้พักไม่ถึง 11 ชม.
                            if ((shiftType === 'ช' || shiftType === 'ด' || shiftType === '8-20') && (yestBaseShifts.includes('บ') || yestBaseShifts.includes('*บ') || yestBaseShifts.includes('20-8'))) return false;

                            return true;
                        });

                        // Shuffle & Sort by shift count to ensure fairness
                        for (let i = availableNurses.length - 1; i > 0; i--) {
                            const j = Math.floor(Math.random() * (i + 1));
                            [availableNurses[i], availableNurses[j]] = [availableNurses[j], availableNurses[i]];
                        }
                        availableNurses.sort((a, b) => nurseShiftCounts[a.id] - nurseShiftCounts[b.id]);

                        for (let i = 0; i < exactNeeded && i < availableNurses.length; i++) {
                            const targetNurse = availableNurses[i];
                            const key = `${targetNurse.id}-${d}`;
                            newSchedules[key] = [shiftType];
                            nurseShiftCounts[targetNurse.id]++;
                            currentCounts[shiftType]++; // Update live counter
                        }
                    }
                }

                setSchedules(newSchedules);

                const recordsToSave = [];
                filteredNurses.forEach(nurse => {
                    for (let d = 1; d <= daysInMonth; d++) {
                         const key = `${nurse.id}-${d}`;
                         const shifts = newSchedules[key] || [];
                         recordsToSave.push({
                            recordId: `${nurse.id}-${currentYear}-${currentMonth}-${d.toString().padStart(2, '0')}`,
                            date: `${currentYear}-${currentMonth}-${d.toString().padStart(2, '0')}`,
                            ward: selectedWard,
                            nurseId: nurse.id,
                            nurseName: nurse.name,
                            shifts: shifts
                         });
                    }
                });

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'batchSaveShifts', data: { records: recordsToSave } })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setAlertMsg("จัดเวรอัตโนมัติและบันทึกข้อมูลลงฐานข้อมูลเรียบร้อยแล้ว");
                    } else throw new Error(result.message);
                } catch (error) {
                    setAlertMsg("บันทึกข้อมูลไม่สำเร็จ: " + error.message);
                } finally {
                    setIsSaving(false);
                }
            };

            const clearAIShifts = async () => {
                if(!confirm('คุณต้องการเคลียร์เวรหลักและเวรเสริมของทุกคนในเดือนนี้ใช่หรือไม่?\n\n*เวร OFF (O), ลาพักผ่อน (VAC) และเวรอื่นๆ จะไม่ถูกลบ')) return;
                setIsSaving(true);

                let newSchedules = { ...schedules };
                const shiftsToClear = ['ช', 'บ', 'ด', '8-20', '20-8', '*ช', '*บ', '*ด', 'Rช', 'Rบ', 'Rด'];
                const recordsToSave = [];

                filteredNurses.forEach(nurse => {
                    for (let d = 1; d <= daysInMonth; d++) {
                        const key = `${nurse.id}-${d}`;
                        const currentShifts = newSchedules[key] || [];

                        // เก็บเฉพาะเวรที่ไม่ได้อยู่ในกลุ่ม shiftsToClear
                        const keptShifts = currentShifts.filter(s => !shiftsToClear.includes(getBaseShift(s)));
                        newSchedules[key] = keptShifts;

                        recordsToSave.push({
                            recordId: `${nurse.id}-${currentYear}-${currentMonth}-${d.toString().padStart(2, '0')}`,
                            date: `${currentYear}-${currentMonth}-${d.toString().padStart(2, '0')}`,
                            ward: selectedWard,
                            nurseId: nurse.id,
                            nurseName: nurse.name,
                            shifts: keptShifts
                        });
                    }
                });

                setSchedules(newSchedules);

                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'batchSaveShifts', data: { records: recordsToSave } })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setAlertMsg("เคลียร์เวรเรียบร้อยแล้ว คุณสามารถกดจัดเวรอัตโนมัติใหม่ได้เลย");
                    } else throw new Error(result.message);
                } catch (error) {
                    setAlertMsg("เคลียร์เวรไม่สำเร็จ: " + error.message);
                } finally {
                    setIsSaving(false);
                }
            };

            // ระบบจ่ายเวรพิเศษข้ามวอร์ด
            const handleAssignSpecialShift = async (newNurseId, shiftType, day) => {
                setIsSaving(true);
                let newSchedules = { ...schedules };
                let recordsToSave = [];

                // 1. ดึงเวรนี้ออกจากพยาบาลทุกคนก่อน (ในวันเดียวกัน)
                nurses.forEach(n => {
                    const cellKey = `${n.id}-${day}`;
                    const shifts = newSchedules[cellKey] || [];
                    if (shifts.includes(shiftType)) {
                        const updatedShifts = shifts.filter(s => s !== shiftType);
                        newSchedules[cellKey] = updatedShifts;
                        recordsToSave.push({
                            recordId: `${n.id}-${currentYear}-${currentMonth}-${day.toString().padStart(2, '0')}`,
                            date: `${currentYear}-${currentMonth}-${day.toString().padStart(2, '0')}`,
                            ward: n.ward.split(',')[0],
                            nurseId: n.id,
                            nurseName: n.name,
                            shifts: updatedShifts
                        });
                    }
                });

                // 2. ใส่เวรให้คนใหม่
                if (newNurseId) {
                    const cellKey = `${newNurseId}-${day}`;
                    const currentShifts = newSchedules[cellKey] || [];
                    if (currentShifts.length < 2 && !currentShifts.includes(shiftType)) {
                        const updatedShifts = [...currentShifts, shiftType];
                        newSchedules[cellKey] = updatedShifts;
                        
                        const targetNurse = nurses.find(n => n.id === newNurseId);
                        const existingRecordIdx = recordsToSave.findIndex(r => r.nurseId === newNurseId);
                        if (existingRecordIdx > -1) {
                            recordsToSave[existingRecordIdx].shifts = updatedShifts;
                        } else {
                            recordsToSave.push({
                                recordId: `${newNurseId}-${currentYear}-${currentMonth}-${day.toString().padStart(2, '0')}`,
                                date: `${currentYear}-${currentMonth}-${day.toString().padStart(2, '0')}`,
                                ward: targetNurse.ward.split(',')[0],
                                nurseId: targetNurse.id,
                                nurseName: targetNurse.name,
                                shifts: updatedShifts
                            });
                        }
                    } else if (currentShifts.length >= 2) {
                        setAlertMsg("พยาบาลท่านนี้มีเวรครบ 2 เวรในวันนี้แล้ว ไม่สามารถเพิ่มได้");
                        setIsSaving(false);
                        return;
                    }
                }

                setSchedules(newSchedules);

                if (recordsToSave.length > 0) {
                    try {
                        const response = await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'batchSaveShifts', data: { records: recordsToSave } })
                        });
                        const result = await response.json();
                        if (result.status !== 'success') throw new Error(result.message);
                    } catch (error) {
                        setAlertMsg("บันทึกข้อมูลไม่สำเร็จ: " + error.message);
                    }
                }
                setIsSaving(false);
            };

            const submitSwapRequest = async () => {
                if (!swapTargetNurse) return setAlertMsg("กรุณาเลือกผู้ที่จะมาขึ้นเวรแทน");
                setIsSaving(true);
                
                const toNurse = nurses.find(n => n.id === swapTargetNurse);
                const { day } = requestSwapModal.cell;
                const dateStr = `${currentYear}-${currentMonth}-${day.toString().padStart(2, '0')}`;

                const payload = {
                    action: 'requestSwap',
                    data: {
                        date: dateStr, ward: selectedWard,
                        fromId: currentUser.id, fromName: currentUser.name,
                        toId: toNurse.id, toName: toNurse.name,
                        shiftCode: requestSwapModal.shiftToSwap
                    }
                };

                try {
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setAlertMsg(`ส่งคำขอเปลี่ยนเวรเรียบร้อยแล้ว\n(ส่งแจ้งเตือนไปยังเมล์: ${result.sentEmails})`);
                        setRequestSwapModal({ isOpen: false, cell: null, shiftToSwap: null });
                        setSwapTargetNurse('');
                    } else throw new Error(result.message);
                } catch (error) { setAlertMsg("ส่งคำขอไม่สำเร็จ"); } 
                finally { setIsSaving(false); }
            };

            const handleApproveSwap = async (reqId, isApprove) => {
                if(!confirm(`ยืนยันการ ${isApprove ? 'อนุมัติ' : 'ไม่อนุมัติ'} คำขอนี้?`)) return;
                setIsSaving(true);
                
                const targetReq = swapRequests.find(r => r.reqId === reqId);
                const exactDate = targetReq ? targetReq.date : null;

                try {
                    const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'processSwap', data: { reqId: reqId, status: isApprove ? 'Approved' : 'Rejected', exactDate } }) });
                    const result = await response.json();
                    if (result.status === 'success') {
                        setSelectedWard(''); setTimeout(() => setSelectedWard(selectedWard), 50); 
                        if (isApprove) {
                            const req = result.requestInfo;
                            const text = `แจ้งอนุมัติเปลี่ยนเวร ✅\nวันที่: ${req.date}\nเวร: ${req.shiftCode}\nผู้เปลี่ยน: ${req.fromName} 🔄 ${req.toName}\nอนุมัติโดย: ${currentUser.name}`;
                            setNotifyModal({ isOpen: true, message: text, emailSent: result.sentEmail });
                        } else {
                            setAlertMsg(`ไม่อนุมัติคำขอแล้ว\nระบบได้ส่งเมล์แจ้งไปยัง: ${result.sentEmail}`);
                        }
                    } else throw new Error(result.message);
                } catch (error) { setAlertMsg("ดำเนินการไม่สำเร็จ: " + error.message); } 
                finally { setIsSaving(false); }
            };

            const handleSaveNurse = async (e) => {
                e.preventDefault();
                if (isSaving) return;
                const { id, name, ward, position, status, role, calendarId, fullName, email, orderIndex } = nurseModal.data;
                if (!name.trim() || !ward.trim()) return setAlertMsg("กรุณากรอกชื่อและหน่วยงาน");

                setIsSaving(true);
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'saveNurse', data: nurseModal.data })
                    });
                    const result = await response.json();
                    if (result.status === 'success') {
                        if (id === 'NEW') setNurses(prev => [...prev, result.nurse]);
                        else {
                            setNurses(prev => prev.map(n => n.id === id ? result.nurse : n));
                            if(currentUser.id === id) setCurrentUser(result.nurse);

                        setNurseModal({ isOpen: false, data: null });
                        if(showEmailWarning && currentUser.id === id && result.nurse.email) setShowEmailWarning(false);
                        setAlertMsg("บันทึกข้อมูลเรียบร้อยแล้ว");
                    } else throw new Error(result.message);
                } catch (error) { setAlertMsg("บันทึกไม่สำเร็จ: " + error.message); } 
                finally { setIsSaving(false); }
            };

            const handleSaveSettings = async (e) => {
                e.preventDefault();

                try {

                } catch (error) { setAlertMsg("บันทึกไม่สำเร็จ: " + error.message); }

            };

            const getShiftColor = (shiftId) => {
                const base = getBaseShift(shiftId);
                const shift = shiftOptions.find(s => s.id === base);
                return shift ? shift.color : 'bg-gray-100 text-gray-800 border-gray-200';
            };

            // Summary
            const summaryData = useMemo(() => {
                const workingDays = daysArray.filter(d => !isNonWorkingDay(d)).length;
                const requiredHours = workingDays * 8;
                
                let ruleStats = { over12h: 0, over60hWeek: 0, consecutive12h: 0, restUnder11h: 0 };

                const summary = filteredNurses.map(nurse => {
                    let counts = { 'ช': 0, 'บ': 0, 'ด': 0, '8-20': 0, '20-8': 0, 'O': 0, 'VAC': 0, 'อื่นๆ': 0, 'เสริม': 0 };
                    let totalHours = 0;
                    let otherDetails = [];

                    daysArray.forEach(day => {
                        const shifts = schedules[`${nurse.id}-${day}`] || [];
                        shifts.forEach(s => {
                            const base = getBaseShift(s);
                            const opt = shiftOptions.find(x => x.id === base);
                            
                            if (counts[base] !== undefined) counts[base]++;
                            else if (base.startsWith('*')) counts['เสริม']++;
                            else counts['อื่นๆ']++;

                            if (base === 'อื่นๆ') otherDetails.push({ day, text: getShiftDisplay(s) });
                            
                            let dur = 8;
                            if (opt && opt.countValue) dur = parseFloat(opt.countValue) * 8;
                            if (opt && opt.type === 'Leave') dur = 0;
                            totalHours += dur;
                        });
                        
                        // Count Violations for summary stats
                        const v = ruleViolations[`${nurse.id}-${day}`];
                        if (v) {
                            if (v.includes("12 ชม./วัน")) ruleStats.over12h++;
                            if (v.includes("60 ชม.")) ruleStats.over60hWeek++;
                            if (v.includes("3 วัน/สัปดาห์")) ruleStats.consecutive12h++;
                            if (v.includes("11 ชม.")) ruleStats.restUnder11h++;
                        }
                    });

                    const otHours = totalHours - requiredHours;
                    const otShifts = otHours > 0 ? (otHours / 8).toFixed(1) : 0;
                    return { ...nurse, counts, totalHours, otShifts, otherDetails };
                });
                
                return { workingDays, requiredHours, summary, ruleStats };
            }, [schedules, filteredNurses, daysArray, customHolidays, shiftOptions, ruleViolations]);

            const calendarDays = useMemo(() => {
                const firstDayOffset = getDayOfWeek(1);

                const remainingCells = (7 - (days.length % 7)) % 7;

                                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg shadow-md transition-colors">เข้าสู่ระบบ</button>
                            </form>

                            <div className="flex gap-2">

                                {/* โหมด 1: ตารางเต็มเดือน */}
                                {viewMode === 'table' && (
                                    <div className="overflow-auto flex-1 relative no-scrollbar bg-slate-100">
                                        <table className="w-full border-collapse text-sm bg-white">

                                                    {daysArray.map(day => {

                                                                    <div className="flex items-center gap-1 cursor-pointer hover:text-indigo-600 transition-colors flex-1" onClick={() => handleNameClick(nurse)} title="คลิกเพื่อดู/แก้ไขข้อมูลส่วนตัว">

                                                        else handleToggleShift(shift.id);
                                                    }}
                                                    className={`py-3 px-1 rounded-xl border flex flex-col items-center justify-center gap-1 text-center transition-all ${isSelected ? `${shift.color} ring-2 ring-offset-1 border-transparent shadow-sm scale-[1.02]` : 'bg-white hover:bg-slate-50 border-slate-200'}`}
                                                    title={shift.label}
                                                >
                                                    <span className="font-bold text-[15px] leading-none">{shift.id}</span>
                                                    <span className="text-[9px] text-slate-500 leading-tight w-full truncate px-1">{shift.label}</span>
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                                <div className="p-3 bg-slate-50 border-t flex justify-end">
                                    <button onClick={() => setSelectedCell(null)} className="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2 rounded-lg text-sm font-semibold transition-colors">เสร็จสิ้น</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal ขอเปลี่ยนเวร (พยาบาลทั่วไป) */}
                    {requestSwapModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[60] backdrop-blur-sm p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="p-4 border-b bg-indigo-50 text-indigo-900 font-semibold flex justify-between items-center">
                                    <span>สร้างคำขอเปลี่ยนเวร</span>
                                    <button onClick={() => setRequestSwapModal({ isOpen: false, cell: null, shiftToSwap: null })}><Icons.Close /></button>
                                </div>
                                <div className="p-5">
                                    <p className="text-sm text-slate-600 mb-4">คุณกำลังทำรายการขอเปลี่ยนเวรในวันที่ <span className="font-bold text-slate-900">{requestSwapModal.cell.day} {displayMonthName}</span></p>
                                    <div className="mb-4">
                                        <label className="block text-xs font-medium text-slate-500 mb-1">เวรปัจจุบันของคุณที่ต้องการเปลี่ยน</label>
                                        <select value={requestSwapModal.shiftToSwap} onChange={e => setRequestSwapModal({...requestSwapModal, shiftToSwap: e.target.value})} className="w-full border border-slate-300 rounded-lg px-3 py-2 outline-none font-semibold text-indigo-700 bg-indigo-50">
                                            {(schedules[`${currentUser.id}-${requestSwapModal.cell.day}`] || []).map(s => <option key={s} value={s}>{s}</option>)}
                                        </select>
                                    </div>
                                    <div className="mb-6">
                                        <label className="block text-xs font-medium text-slate-500 mb-1">เลือกพยาบาลที่จะมาขึ้นเวรแทน <span className="text-red-500">*</span></label>
                                        <select value={swapTargetNurse} onChange={e => setSwapTargetNurse(e.target.value)} className="w-full border border-slate-300 focus:border-indigo-500 rounded-lg px-3 py-2 outline-none bg-white">
                                            <option value="">-- เลือกรายชื่อ --</option>
                                            {filteredNurses.filter(n => n.id !== currentUser.id).map(n => <option key={n.id} value={n.id}>{n.name}</option>)}
                                        </select>
                                    </div>
                                    <div className="bg-amber-50 border border-amber-200 text-amber-700 text-xs p-3 rounded-lg flex gap-2">
                                        <Icons.AlertCircle /><span>คำขอนี้จะถูกส่ง Email แจ้งไปยังหัวหน้าวอร์ด (อัตโนมัติ) และรอการอนุมัติเข้าระบบต่อไป</span>
                                    </div>
                                </div>
                                <div className="p-3 bg-slate-50 border-t flex justify-end gap-2">
                                    <button onClick={() => setRequestSwapModal({ isOpen: false, cell: null, shiftToSwap: null })} className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-200 rounded-lg">ยกเลิก</button>
                                    <button onClick={submitSwapRequest} disabled={isSaving} className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm flex items-center gap-2 transition-colors">
                                        {isSaving ? <Icons.Spinner /> : 'ส่งคำขออนุมัติ'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal แจ้งข้อความ Line (เมื่ออนุมัติ) */}
                    {notifyModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[80] p-4">
                            <div className="bg-white rounded-xl shadow-xl w-full max-w-sm overflow-hidden">
                                <div className="p-5">
                                    <h3 className="font-semibold text-emerald-600 mb-2 flex items-center gap-2"><Icons.Check /> สลับตารางเวรสำเร็จ</h3>
                                    {notifyModal.emailSent && notifyModal.emailSent !== '- (ไม่มีอีเมลในระบบ)' && (
                                        <p className="text-xs text-indigo-600 bg-indigo-50 px-2 py-1 rounded mb-3 font-semibold">ส่งแจ้งเตือนไปยัง: {notifyModal.emailSent}</p>
                                    )}
                                    <p className="text-xs text-slate-500 mb-2">คัดลอกข้อความด้านล่างเพื่อแจ้งลงในกลุ่ม LINE</p>
                                    <textarea 
                                        readOnly 
                                        value={notifyModal.message} 
                                        className="w-full h-32 bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm font-mono text-slate-700 outline-none resize-none"
                                    ></textarea>
                                </div>
                                <div className="p-3 bg-slate-50 border-t flex justify-end gap-2">
                                    <button onClick={() => {
                                        navigator.clipboard.writeText(notifyModal.message);
                                        setAlertMsg("คัดลอกข้อความแล้ว");
                                    }} className="bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm">คัดลอก</button>
                                    <button onClick={() => setNotifyModal({ isOpen: false, message: '', emailSent: '' })} className="bg-emerald-500 text-white px-6 py-2 rounded-lg text-sm">ปิด</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal แก้ไขพยาบาล */}
                    {nurseModal.isOpen && nurseModal.data && (
                        <div className="fixed inset-0 bg-slate-900/60 flex items-center justify-center z-[70] backdrop-blur-sm p-4">
                            <form onSubmit={handleSaveNurse} className="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
                                <div className="p-4 border-b bg-slate-50 flex justify-between">
                                    <h3 className="font-bold text-slate-800">
                                        {nurseModal.data.id === 'NEW' ? 'เพิ่มบุคลากรใหม่' : (currentUser.role === 'Headward' ? 'แก้ไขข้อมูลบุคลากร' : 'ข้อมูลส่วนตัว')}
                                    </h3>
                                    <button type="button" onClick={() => setNurseModal({isOpen:false, data:null})}><Icons.Close /></button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">ชื่อ-สกุลจริง <span className="text-red-500">*</span></label>
                                            <input required type="text" value={nurseModal.data.fullName || ''} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, fullName: e.target.value}})} className="w-full border rounded px-3 py-1.5 text-sm" />
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">ชื่อในตารางเวร <span className="text-red-500">*</span></label>
                                            <input required type="text" value={nurseModal.data.name} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, name: e.target.value}})} className="w-full border rounded px-3 py-1.5 text-sm" />
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">อีเมล <span className="text-red-500">*</span></label>
                                            <input required type="email" autoComplete="email" value={nurseModal.data.email || ''} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, email: e.target.value}})} className="w-full border rounded px-3 py-1.5 text-sm" />
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Calendar ID</label>
                                            <input type="text" value={nurseModal.data.calendarId || ''} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, calendarId: e.target.value}})} className="w-full border rounded px-3 py-1.5 text-sm" />
                                        </div>
                                        
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">วอร์ด (ใส่หลายวอร์ดคั่นด้วย ,)</label>
                                            <input type="text" value={nurseModal.data.ward} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, ward: e.target.value}})} disabled={currentUser.role !== 'Headward'} className={`w-full border rounded px-3 py-1.5 text-sm ${currentUser.role !== 'Headward' ? 'bg-slate-100 text-slate-500' : ''}`} placeholder="เช่น วอร์ดชาย, วอร์ดหญิง" />
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">ตำแหน่ง</label>
                                            <input type="text" value={nurseModal.data.position || ''} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, position: e.target.value}})} disabled={currentUser.role !== 'Headward'} className={`w-full border rounded px-3 py-1.5 text-sm ${currentUser.role !== 'Headward' ? 'bg-slate-100 text-slate-500' : ''}`} />
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">บทบาท</label>
                                            <select value={nurseModal.data.role} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, role: e.target.value}})} disabled={currentUser.role !== 'Headward'} className={`w-full border rounded px-3 py-1.5 text-sm ${currentUser.role !== 'Headward' ? 'bg-slate-100 text-slate-500' : ''}`}>
                                                <option value="">RN ปกติ</option><option value="Headward">หัวหน้าวอร์ด</option>
                                            </select>
                                        </div>
                                        <div className="col-span-2 sm:col-span-1">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">สถานะ</label>
                                            <select value={nurseModal.data.status} onChange={e => setNurseModal({...nurseModal, data: {...nurseModal.data, status: e.target.value}})} disabled={currentUser.role !== 'Headward'} className={`w-full border rounded px-3 py-1.5 text-sm ${currentUser.role !== 'Headward' ? 'bg-slate-100 text-slate-500' : ''}`}>
                                                <option value="Active">Active</option><option value="Inactive">Inactive</option><option value="Deleted">Deleted (ซ่อน)</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div className="p-3 border-t bg-slate-50 flex justify-end gap-2">
                                    <button type="button" onClick={() => setNurseModal({isOpen:false, data:null})} className="px-4 py-1.5 rounded bg-slate-200 text-sm">ยกเลิก</button>
                                    <button type="submit" disabled={isSaving} className="px-6 py-1.5 rounded bg-indigo-600 text-white text-sm font-bold flex items-center gap-2">
                                        {isSaving && <Icons.Spinner />} บันทึก
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
